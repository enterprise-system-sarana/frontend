services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://69.58.63.127:3333/api/v1
        VITE_ACCESS_TOKEN_KEY: access_token
        VITE_REFRESH_TOKEN_KEY: refresh_token
        VITE_USER_KEY: auth_user
    container_name: 360-phone-shop-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - 360-phone-shop-service

networks:
  360-phone-shop-service:
    external: true
