<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 phone shop Management System</title>
  <!-- Apply the saved theme and primary colour before first paint so they don't flash -->
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      var primaryColorCss = localStorage.getItem("app_primary_color_css");
      if (primaryColorCss) {
        var primaryColorStyle = document.createElement("style");
        primaryColorStyle.id = "primary-color-theme";
        primaryColorStyle.textContent = primaryColorCss;
        document.head.appendChild(primaryColorStyle);
      }
    } catch { }
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
